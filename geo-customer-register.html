<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>ثبت‌نام مشتری | GEO</title>
<link rel="manifest" href="manifest-geo.json">
<link rel="icon" type="image/png" href="icons/geo-192.png">
<style>
:root{--navy:#0a1929;--navy-2:#102a43;--navy-3:#1a3a5c;--gold:#d4af37;--gold-2:#f4d03f;--gold-soft:rgba(212,175,55,0.15);--text:#e8eef5;--text-dim:#8ba3bd;--card:#132f4c;--border:rgba(212,175,55,0.22);--danger:#e74c3c;--success:#2ecc71}
body.light{--navy:#f5f7fa;--navy-2:#fff;--navy-3:#e8eef5;--text:#1a2942;--text-dim:#6b7d95;--card:#fff;--border:rgba(212,175,55,0.35)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:Tahoma,'Segoe UI',sans-serif;background:var(--navy);color:var(--text);overflow-x:hidden;min-height:100vh;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 15%,rgba(26,58,92,0.85) 0%,transparent 55%),radial-gradient(circle at 85% 85%,rgba(212,175,55,0.12) 0%,transparent 55%),linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%)}
body.light .bg{background:radial-gradient(circle at 15% 15%,rgba(212,175,55,0.15) 0%,transparent 55%),radial-gradient(circle at 85% 85%,rgba(26,90,150,0.1) 0%,transparent 55%),linear-gradient(160deg,#f5f7fa 0%,#e8eef5 50%,#dfe6ee 100%)}
.page{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;padding:20px}
.top-bar{display:flex;justify-content:space-between;gap:8px;margin-bottom:16px;align-items:center}
.back-btn,.theme-btn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.back-btn:active,.theme-btn:active{transform:scale(0.92)}
.back-btn svg,.theme-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2}
.theme-btn .sun{display:none}.theme-btn .moon{display:block}
body.light .theme-btn .sun{display:block}body.light .theme-btn .moon{display:none}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:420px;width:100%;margin:0 auto}
.logo-small{width:80px;height:80px;margin-bottom:16px;display:flex;align-items:center;justify-content:center}
.logo-small img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(212,175,55,0.4))}
.form-title{text-align:center;margin-bottom:20px}
.form-title h1{font-size:18px;font-weight:900;color:var(--gold);margin-bottom:4px}
.form-title p{font-size:11.5px;color:var(--text-dim)}
.form-box{width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px 18px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
body.light .form-box{box-shadow:0 20px 60px rgba(0,0,0,0.08)}
.error-box{background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.4);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:none;align-items:center;gap:8px;animation:shake .4s}
.error-box.show{display:flex}
.error-box svg{width:18px;height:18px;stroke:var(--danger);fill:none;stroke-width:2;flex-shrink:0}
.error-box span{font-size:12px;color:var(--danger);font-weight:700}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.success-box{background:rgba(46,204,113,0.12);border:1px solid rgba(46,204,113,0.4);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:none;align-items:center;gap:8px}
.success-box.show{display:flex}
.success-box svg{width:18px;height:18px;stroke:var(--success);fill:none;stroke-width:2;flex-shrink:0}
.success-box span{font-size:12px;color:var(--success);font-weight:700}
.input-wrap{position:relative;margin-bottom:12px}
.input-wrap input{width:100%;height:50px;background:var(--navy-2);border:1.5px solid var(--border);border-radius:14px;padding:0 48px 0 16px;color:var(--text);font-size:13.5px;outline:none;transition:all .2s}
.input-wrap input:focus{background:var(--navy-2);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.input-wrap input::placeholder{color:var(--text-dim)}
.input-wrap .icon{position:absolute;top:50%;right:16px;transform:translateY(-50%);width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;pointer-events:none}
.input-wrap .eye{position:absolute;top:50%;left:8px;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.input-wrap .eye svg{width:18px;height:18px;stroke:var(--text-dim);fill:none;stroke-width:2}
.input-hint{font-size:10.5px;color:var(--text-dim);margin-top:-6px;margin-bottom:10px;padding-inline-start:4px}
.remember{display:flex;align-items:center;gap:8px;margin:14px 0;cursor:pointer;user-select:none}
.remember input{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}
.remember span{font-size:12.5px;color:var(--text-dim);cursor:pointer}
.btn-primary{width:100%;height:52px;border-radius:14px;background:linear-gradient(135deg,#f4d03f,#d4af37);color:var(--navy);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(212,175,55,0.4);margin-top:6px}
.btn-primary:active{transform:scale(0.97)}
.btn-primary:disabled{opacity:0.6}
.btn-primary svg{width:20px;height:20px;stroke:var(--navy);fill:none;stroke-width:2.5}
.btn-outline{width:100%;height:48px;border-radius:14px;background:var(--navy-2);border:1.5px solid var(--border);color:var(--gold);font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.btn-outline svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2}
.footer{text-align:center;padding:20px 0 10px;font-size:10px;color:var(--text-dim);line-height:1.8}
.footer strong{color:var(--gold)}
.loading-overlay{position:fixed;inset:0;z-index:500;background:var(--navy);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-overlay.show{display:flex}
.spinner{width:56px;height:56px;border:4px solid var(--gold-soft);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay p{color:var(--gold);font-size:13px;font-weight:800}
</style>
</head>
<body>

<div class="bg"></div>

<div class="page">
  <div class="top-bar">
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="theme-btn" onclick="toggleTheme()">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div class="center">
    <div class="logo-small">
      <img src="icons/geo-512.png" alt="GEO">
    </div>

    <div class="form-title">
      <h1>ثبت‌نام مشتری</h1>
      <p>شرکت فرصت‌های تحصیلی غرجستان</p>
    </div>

    <div class="form-box">
      <div class="error-box" id="errorBox">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <span id="errorMsg"></span>
      </div>
      <div class="success-box" id="successBox">
        <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span id="successMsg"></span>
      </div>

      <div class="input-wrap">
        <input type="text" id="regName" placeholder="نام کامل شما">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
      </div>

      <div class="input-wrap">
        <input type="tel" id="regPhone" placeholder="شماره واتساپ (07xxxxxxxx)" inputmode="numeric">
        <svg class="icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
      <div class="input-hint">این شماره برای ورود و تماس استفاده می‌شود</div>

      <div class="input-wrap">
        <input type="email" id="regEmail" placeholder="ایمیل (اختیاری)" inputmode="email">
        <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22 6 12 13 2 6"/></svg>
      </div>

      <div class="input-wrap">
        <input type="password" id="regPassword" placeholder="رمز عبور (حداقل ۴ کاراکتر)">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <button class="eye" onclick="togglePass('regPassword',this)" type="button">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="input-wrap">
        <input type="password" id="regPassword2" placeholder="تکرار رمز عبور">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <button class="eye" onclick="togglePass('regPassword2',this)" type="button">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <label class="remember">
        <input type="checkbox" id="rememberMe" checked>
        <span>مرا به خاطر بسپار (ورود سریع در دفعات بعد)</span>
      </label>

      <button class="btn-primary" id="regBtn" onclick="doRegister()">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        ثبت‌نام و ورود
      </button>

      <button class="btn-outline" onclick="location.href='geo-login.html'">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        قبلاً ثبت‌نام کردم
      </button>
    </div>

    <div class="footer">
      Powered by <strong>GEO</strong> — v1.0<br>
      © 2024 شرکت فرصت‌های تحصیلی غرجستان
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p>در حال ثبت‌نام...</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
var K_THEME = 'geo_theme';
var K_SESSION = 'geo_session';
var K_REMEMBERED_CUSTOMER = 'geo_remembered_customer';
var db = null;

function applyTheme(){
  var t = localStorage.getItem(K_THEME) || 'dark';
  document.body.classList.toggle('light', t === 'light');
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t === 'light' ? '#f5f7fa' : '#0a1929';
}
function toggleTheme(){
  var t = localStorage.getItem(K_THEME) || 'dark';
  localStorage.setItem(K_THEME, t === 'light' ? 'dark' : 'light');
  applyTheme();
}
applyTheme();

function initFirebase(){
  if(typeof firebase === 'undefined') return false;
  try {
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    return true;
  } catch(e){ return false; }
}
initFirebase();

function togglePass(id, btn){
  var inp = document.getElementById(id);
  var svg = btn.querySelector('svg');
  if(inp.type === 'password'){
    inp.type = 'text';
    svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type = 'password';
    svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function showError(msg){
  document.getElementById('errorMsg').textContent = msg;
  var b = document.getElementById('errorBox');
  b.classList.add('show');
  document.getElementById('successBox').classList.remove('show');
  setTimeout(function(){ b.classList.remove('show'); }, 4000);
}
function showSuccess(msg){
  document.getElementById('successMsg').textContent = msg;
  var b = document.getElementById('successBox');
  b.classList.add('show');
  document.getElementById('errorBox').classList.remove('show');
}

function normalizePhone(p){
  p = String(p).replace(/[^0-9+]/g, '');
  if(p.indexOf('+93') === 0) p = '0' + p.substring(3);
  return p;
}

async function doRegister(){
  var name = document.getElementById('regName').value.trim();
  var phone = normalizePhone(document.getElementById('regPhone').value.trim());
  var email = document.getElementById('regEmail').value.trim();
  var pass = document.getElementById('regPassword').value;
  var pass2 = document.getElementById('regPassword2').value;
  var remember = document.getElementById('rememberMe').checked;

  /* Validation */
  if(!name || name.length < 2){ showError('نام کامل خود را وارد کنید'); return; }
  if(!phone || phone.length < 10){ showError('شماره واتساپ معتبر وارد کنید'); return; }
  if(email && email.indexOf('@') === -1){ showError('ایمیل معتبر وارد کنید'); return; }
  if(!pass || pass.length < 4){ showError('رمز عبور حداقل ۴ کاراکتر'); return; }
  if(pass !== pass2){ showError('رمز و تکرار آن یکسان نیستند'); return; }

  var btn = document.getElementById('regBtn');
  btn.disabled = true;

  try {
    /* Check if phone already registered */
    if(db){
      var existSnap = await db.collection(GEO_SETTINGS.COLLECTION_CUSTOMERS)
        .where('phone', '==', phone).limit(1).get();
      if(!existSnap.empty){
        showError('این شماره قبلاً ثبت‌نام کرده. وارد شوید.');
        btn.disabled = false;
        return;
      }
    }

    var customerId = 'cust_' + btoa(unescape(encodeURIComponent(phone))).replace(/[^a-zA-Z0-9]/g, '').substring(0, 20);
    var now = Date.now();

    var customerData = {
      name: name,
      phone: phone,
      email: email,
      password: pass,
      createdAt: now,
      lastLogin: now,
      loginCount: 1,
      status: 'active'
    };

    /* Save to Firestore */
    if(db){
      try {
        await db.collection(GEO_SETTINGS.COLLECTION_CUSTOMERS).doc(customerId).set(customerData);
        await db.collection(GEO_SETTINGS.COLLECTION_LOGS).add({
          userId: customerId,
          userName: name,
          action: 'customer_register',
          details: 'شماره: ' + phone,
          timestamp: now,
          date: new Date().toISOString()
        });
      } catch(e){ console.warn('Firestore:', e); }
    }

    /* Save session */
    var session = {
      role: 'customer',
      userId: customerId,
      name: name,
      phone: phone,
      email: email,
      loggedIn: true,
      loginAt: now
    };
    localStorage.setItem(K_SESSION, JSON.stringify(session));

    /* Remember customer if checkbox */
    if(remember){
      localStorage.setItem(K_REMEMBERED_CUSTOMER, JSON.stringify({ phone: phone, name: name }));
    } else {
      localStorage.removeItem(K_REMEMBERED_CUSTOMER);
    }

    showSuccess('ثبت‌نام موفق! در حال ورود...');
    document.getElementById('loadingOverlay').classList.add('show');
    setTimeout(function(){
      location.href = 'geo-customer.html';
    }, 900);

  } catch(e){
    console.error(e);
    showError('خطا در ثبت‌نام. دوباره تلاش کنید.');
    btn.disabled = false;
  }
}

/* Auto-fill remembered phone */
(function(){
  var r = localStorage.getItem(K_REMEMBERED_CUSTOMER);
  if(r){
    try {
      var data = JSON.parse(r);
      if(data.phone) document.getElementById('regPhone').value = data.phone;
      if(data.name) document.getElementById('regName').value = data.name;
    } catch(e){}
  }
})();

/* If already logged in as customer → go to panel */
(function(){
  var s = localStorage.getItem(K_SESSION);
  if(s){
    try {
      var data = JSON.parse(s);
      if(data && data.loggedIn && data.role === 'customer'){
        location.replace('geo-customer.html');
      }
    } catch(e){}
  }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw-geo.js', {scope: './'}).catch(function(){});
  });
}
</script>
</body>
</html>
