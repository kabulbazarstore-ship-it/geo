<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1929">
<title>GEO | شرکت فرصت‌های تحصیلی غرجستان</title>
<link rel="manifest" href="manifest-geo.json">
<link rel="icon" type="image/png" href="icons/geo-192.png">
<link rel="apple-touch-icon" href="icons/geo-192.png">
<style>
:root{--navy:#0a1929;--navy-2:#102a43;--navy-3:#1a3a5c;--gold:#d4af37;--gold-2:#f4d03f;--gold-soft:rgba(212,175,55,0.15);--text:#e8eef5;--text-dim:#8ba3bd;--card:#132f4c;--border:rgba(212,175,55,0.22);--danger:#e74c3c;--success:#2ecc71}
body.light{--navy:#f5f7fa;--navy-2:#fff;--navy-3:#e8eef5;--text:#1a2942;--text-dim:#6b7d95;--card:#fff;--border:rgba(212,175,55,0.35)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:Tahoma,'Segoe UI',sans-serif;background:var(--navy);color:var(--text);overflow-x:hidden;min-height:100vh;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 15%,rgba(26,58,92,0.85) 0%,transparent 55%),radial-gradient(circle at 85% 85%,rgba(212,175,55,0.12) 0%,transparent 55%),linear-gradient(160deg,#0a1929 0%,#0d2137 50%,#050d17 100%);transition:background .3s}
body.light .bg{background:radial-gradient(circle at 15% 15%,rgba(212,175,55,0.15) 0%,transparent 55%),radial-gradient(circle at 85% 85%,rgba(26,90,150,0.1) 0%,transparent 55%),linear-gradient(160deg,#f5f7fa 0%,#e8eef5 50%,#dfe6ee 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.5;animation:float 20s ease-in-out infinite}
.orb.o1{width:300px;height:300px;background:radial-gradient(circle,rgba(212,175,55,0.55),transparent 70%);top:-100px;right:-100px}
.orb.o2{width:280px;height:280px;background:radial-gradient(circle,rgba(26,90,150,0.7),transparent 70%);bottom:-100px;left:-100px;animation-delay:-10s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-25px) scale(1.1)}66%{transform:translate(-25px,35px) scale(0.95)}}
.page{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;padding:20px}
.top-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:20px}
.theme-btn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.theme-btn:active{transform:scale(0.92)}
.theme-btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2}
.theme-btn .sun{display:none}.theme-btn .moon{display:block}
body.light .theme-btn .sun{display:block}body.light .theme-btn .moon{display:none}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:440px;width:100%;margin:0 auto}
.logo{width:130px;height:130px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;position:relative;animation:logoIn .6s ease;cursor:pointer;user-select:none}
@keyframes logoIn{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
.logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 30px rgba(212,175,55,0.5))}
.brand{text-align:center;margin:16px 0}
.brand h1{font-size:18px;font-weight:900;color:var(--gold);margin-bottom:6px;line-height:1.5}
.brand p.en{font-size:10.5px;color:var(--text-dim);line-height:1.6;direction:ltr;letter-spacing:0.5px}
.brand .slogan{margin-top:10px;padding:7px 14px;background:var(--gold-soft);border:1px solid var(--border);border-radius:20px;display:inline-block;font-size:11px;color:var(--gold);font-weight:700}
.social-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.social-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:11.5px;font-weight:700;color:var(--text-dim);transition:all .2s;text-decoration:none}
.social-btn:active{transform:scale(0.95);background:var(--gold-soft)}
.social-btn svg{width:16px;height:16px;fill:currentColor}
.social-btn.wa svg{fill:#25D366}
.social-btn.wa{color:#25D366;border-color:rgba(37,211,102,0.3)}
.social-btn.ph svg{stroke:var(--gold);fill:none;stroke-width:2}
.social-btn.ph{color:var(--gold)}
.form-box{width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px 18px;box-shadow:0 20px 60px rgba(0,0,0,0.4);transition:all .3s}
body.light .form-box{box-shadow:0 20px 60px rgba(0,0,0,0.08)}
.form-box .icon-circle{width:52px;height:52px;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.form-box .icon-circle svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:2}
.form-box h2{text-align:center;font-size:15px;font-weight:800;color:var(--text);margin-bottom:4px}
.form-box .hint{text-align:center;font-size:11px;color:var(--text-dim);margin-bottom:16px}
.input-wrap{position:relative;margin-bottom:12px}
.input-wrap input,.input-wrap select{width:100%;height:50px;background:var(--navy-2);border:1.5px solid var(--border);border-radius:14px;padding:0 48px 0 16px;color:var(--text);font-size:13.5px;outline:none;transition:all .2s}
.input-wrap input:focus,.input-wrap select:focus{background:var(--navy-2);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.input-wrap input::placeholder{color:var(--text-dim)}
.input-wrap .icon{position:absolute;top:50%;right:16px;transform:translateY(-50%);width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;pointer-events:none}
.input-wrap .eye{position:absolute;top:50%;left:8px;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.input-wrap .eye svg{width:18px;height:18px;stroke:var(--text-dim);fill:none;stroke-width:2}
.tabs-toggle{display:flex;gap:8px;margin-bottom:16px;background:var(--navy-2);padding:4px;border-radius:12px;border:1px solid var(--border)}
.tabs-toggle button{flex:1;padding:10px;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--text-dim);transition:all .2s}
.tabs-toggle button.active{background:var(--gold);color:var(--navy)}
.remember{display:flex;align-items:center;gap:8px;margin:14px 0;cursor:pointer;user-select:none}
.remember input{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}
.remember span{font-size:12.5px;color:var(--text-dim);cursor:pointer}
.btn-login{width:100%;height:50px;border-radius:14px;background:linear-gradient(135deg,#f4d03f,#d4af37);color:var(--navy);font-weight:900;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(212,175,55,0.4);margin-top:6px}
.btn-login:active{transform:scale(0.97)}
.btn-login svg{width:20px;height:20px;stroke:var(--navy);fill:none;stroke-width:2.5}
.btn-login:disabled{opacity:0.6}
.btn-register{width:100%;height:46px;border-radius:14px;background:var(--navy-2);border:1.5px solid var(--border);color:var(--gold);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.btn-register svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:2}
.error-box{background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.4);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:none;align-items:center;gap:8px;animation:shake .4s}
.error-box.show{display:flex}
.error-box svg{width:18px;height:18px;stroke:var(--danger);fill:none;stroke-width:2;flex-shrink:0}
.error-box span{font-size:12px;color:var(--danger);font-weight:700}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.footer{text-align:center;padding:20px 0 10px;font-size:10px;color:var(--text-dim);line-height:1.8}
.footer strong{color:var(--gold)}
.footer .geo-copy{margin-top:6px;font-size:9.5px;opacity:0.7}
.loading-overlay{position:fixed;inset:0;z-index:500;background:var(--navy);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-overlay.show{display:flex}
.spinner{width:56px;height:56px;border:4px solid var(--gold-soft);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay p{color:var(--gold);font-size:13px;font-weight:800}
</style>
</head>
<body>

<div class="bg"><div class="orb o1"></div><div class="orb o2"></div></div>

<div class="page">
  <div class="top-bar">
    <button class="theme-btn" onclick="toggleTheme()">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div class="center">
    <div class="logo" id="logoBtn" onclick="logoClick()">
      <img src="icons/geo-512.png" alt="GEO">
    </div>

    <div class="brand">
      <h1>شرکت فرصت‌های تحصیلی غرجستان</h1>
      <p class="en">Gharjistan Educational Opportunities</p>
      <div class="slogan">غرجستان — دروازه‌ی فرصت‌ها</div>
    </div>

    <div class="social-row">
      <a class="social-btn wa" href="https://whatsapp.com/channel/0029Vb3BpwQFnSzDK62fxA2l" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
        کانال واتساپ
      </a>
      <a class="social-btn ph" href="tel:0784030240">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        تماس
      </a>
    </div>

    <div class="form-box">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>

      <div class="tabs-toggle">
        <button class="active" id="tabEmployee" onclick="switchRole('employee')">کارمند</button>
        <button id="tabCustomer" onclick="switchRole('customer')">مشتری</button>
      </div>

      <h2 id="formTitle">ورود کارمند</h2>
      <p class="hint" id="formHint">نام و رمز عبور خود را وارد کنید</p>

      <div class="error-box" id="errorBox">

        <span id="errorMsg"></span>
      </div>

      <div class="input-wrap" id="nameRow">
        <input type="text" id="nameInput" placeholder="نام کامل شما">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
      </div>

      <div class="input-wrap" id="phoneRow" style="display:none">
        <input type="tel" id="phoneInput" placeholder="شماره واتساپ (07xxxxxxxx)" inputmode="numeric">
        <svg class="icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>

      <div class="input-wrap">
        <input type="password" id="passwordInput" placeholder="رمز عبور" onkeypress="if(event.key==='Enter')doLogin()">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <button class="eye" onclick="togglePassword()" type="button">
          <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <label class="remember">
        <input type="checkbox" id="rememberMe">
        <span>مرا به خاطر بسپار (ورود سریع در دفعات بعد)</span>
      </label>

      <button class="btn-login" id="loginBtn" onclick="doLogin()">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        ورود
      </button>

      <button class="btn-register" id="registerBtn" style="display:none" onclick="location.href='geo-customer-register.html'">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        ثبت‌نام مشتری جدید
      </button>
    </div>

    <div class="footer">
      <div>Powered by <strong>GEO</strong> — v1.0</div>
      <div class="geo-copy">© 2024 شرکت فرصت‌های تحصیلی غرجستان</div>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p id="loadingText">در حال ورود...</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
var K_THEME = 'geo_theme';
var K_SESSION = 'geo_session';
var K_REMEMBERED_CUSTOMER = 'geo_remembered_customer';
var K_REMEMBERED_EMPLOYEE = 'geo_remembered_employee';
var K_REMEMBERED_ADMIN = 'geo_remembered_admin';
var currentRole = 'employee';
var db = null;
var logoClicks = [];

function applyTheme(){
  var t = localStorage.getItem(K_THEME) || 'dark';
  document.body.classList.toggle('light', t === 'light');
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t === 'light' ? '#f5f7fa' : '#0a1929';
}
function toggleTheme(){
  var t = localStorage.getItem(K_THEME) || 'dark';
  localStorage.setItem(K_THEME, t === 'light' ? 'dark' : 'light');
  applyTheme();
}
applyTheme();

function initFirebase(){
  if(typeof firebase === 'undefined') return false;
  try {
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    return true;
  } catch(e){ return false; }
}
initFirebase();

/* ===== Hidden Admin Access ===== */
function logoClick(){
  var now = Date.now();
  logoClicks.push(now);
  logoClicks = logoClicks.filter(function(t){ return now - t < 2000; });
  if(logoClicks.length >= 5){
    logoClicks = [];
    switchRole('admin');
    showError('حالت مدیر فعال شد');
    setTimeout(function(){ document.getElementById('errorBox').classList.remove('show'); }, 2000);
  }
}

/* ===== Role Switch ===== */
function switchRole(r){
  currentRole = r;

  document.getElementById('tabEmployee').classList.toggle('active', r === 'employee');
  document.getElementById('tabCustomer').classList.toggle('active', r === 'customer');

  document.getElementById('nameRow').style.display = (r === 'employee') ? 'block' : 'none';
  document.getElementById('phoneRow').style.display = (r === 'customer') ? 'block' : 'none';
  document.getElementById('registerBtn').style.display = (r === 'customer') ? 'flex' : 'none';

  if(r === 'employee'){
    document.getElementById('formTitle').textContent = 'ورود کارمند';
    document.getElementById('formHint').textContent = 'نام و رمز عبور خود را وارد کنید';
    document.getElementById('nameInput').value = '';
    document.getElementById('phoneInput').value = '';
    document.getElementById('passwordInput').value = '';
  } else if(r === 'customer'){
    document.getElementById('formTitle').textContent = 'ورود مشتری';
    document.getElementById('formHint').textContent = 'شماره واتساپ و رمز خود را وارد کنید';
    document.getElementById('nameInput').value = '';
    document.getElementById('phoneInput').value = '';
    document.getElementById('passwordInput').value = '';
  } else if(r === 'admin'){
    document.getElementById('formTitle').textContent = 'ورود مدیر';
    document.getElementById('formHint').textContent = 'رمز مدیریت را وارد کنید';
    document.getElementById('nameRow').style.display = 'none';
    document.getElementById('phoneRow').style.display = 'none';
    document.getElementById('registerBtn').style.display = 'none';
    document.getElementById('tabEmployee').classList.remove('active');
    document.getElementById('tabCustomer').classList.remove('active');
    document.getElementById('nameInput').value = '';
    document.getElementById('phoneInput').value = '';
    document.getElementById('passwordInput').value = '';
  }

  /* Auto-fill remembered */
  autoFillRemembered();
}

/* ===== Auto-fill Remembered ===== */
function autoFillRemembered(){
  /* Customer */
  var rc = localStorage.getItem(K_REMEMBERED_CUSTOMER);
  if(rc && currentRole === 'customer'){
    try {
      var data = JSON.parse(rc);
      if(data.phone) document.getElementById('phoneInput').value = data.phone;
      if(data.password) document.getElementById('passwordInput').value = data.password;
      document.getElementById('rememberMe').checked = true;
    } catch(e){}
  }
  /* Employee */
  var re = localStorage.getItem(K_REMEMBERED_EMPLOYEE);
  if(re && currentRole === 'employee'){
    try {
      var data2 = JSON.parse(re);
      if(data2.name) document.getElementById('nameInput').value = data2.name;
      if(data2.password) document.getElementById('passwordInput').value = data2.password;
      document.getElementById('rememberMe').checked = true;
    } catch(e){}
  }
  /* Admin */
  var ra = localStorage.getItem(K_REMEMBERED_ADMIN);
  if(ra && currentRole === 'admin'){
    try {
      var data3 = JSON.parse(ra);
      if(data3.password) document.getElementById('passwordInput').value = data3.password;
      document.getElementById('rememberMe').checked = true;
    } catch(e){}
  }
}

/* ===== Password Toggle ===== */
function togglePassword(){
  var inp = document.getElementById('passwordInput');
  var icon = document.getElementById('eyeIcon');
  if(inp.type === 'password'){
    inp.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

/* ===== Error ===== */
function showError(msg){
  document.getElementById('errorMsg').textContent = msg;
  var b = document.getElementById('errorBox');
  b.classList.add('show');
  setTimeout(function(){ b.classList.remove('show'); }, 3500);
}

/* ===== Normalize Phone ===== */
function normalizePhone(p){
  p = String(p).replace(/[^0-9+]/g, '');
  if(p.indexOf('+93') === 0) p = '0' + p.substring(3);
  return p;
}

/* ===== Get Passwords From Cloud ===== */
async function getPasswordsFromCloud(){
  if(!db) return null;
  try {
    var doc = await db.collection(GEO_SETTINGS.COLLECTION_SETTINGS).doc('passwords').get();
    if(doc.exists) return doc.data();
    return null;
  } catch(e){ return null; }
}

/* ===== Admin Login ===== */
async function loginAdmin(){
  var pass = document.getElementById('passwordInput').value.trim();
  if(!pass){ showError('رمز عبور را وارد کنید'); document.getElementById('loginBtn').disabled = false; return; }

  /* Check remembered */
  var ra = localStorage.getItem(K_REMEMBERED_ADMIN);
  if(ra){
    try {
      var data = JSON.parse(ra);
      if(data.password === pass){
        /* Skip cloud check, go directly */
        completeAdminLogin(pass);
        return;
      }
    } catch(e){}
  }

  var cloudPasswords = await getPasswordsFromCloud();
  var adminPass = (cloudPasswords && cloudPasswords.admin) || GEO_SETTINGS.ADMIN_PASSWORD;
  if(pass !== adminPass){ showError('رمز مدیر اشتباه است'); document.getElementById('loginBtn').disabled = false; return; }

  var remember = document.getElementById('rememberMe').checked;
  if(remember) localStorage.setItem(K_REMEMBERED_ADMIN, JSON.stringify({ password: pass }));
  else localStorage.removeItem(K_REMEMBERED_ADMIN);

  completeAdminLogin(pass);
}

function completeAdminLogin(pass){
  var session = { role: 'admin', name: 'مدیر', loggedIn: true, loginAt: Date.now() };
  localStorage.setItem(K_SESSION, JSON.stringify(session));
  document.getElementById('loadingOverlay').classList.add('show');
  setTimeout(function(){ location.href = 'geo-admin.html'; }, 700);
}

/* ===== Employee Login ===== */
async function loginEmployee(){
  var name = document.getElementById('nameInput').value.trim();
  var pass = document.getElementById('passwordInput').value.trim();
  if(!name){ showError('نام خود را وارد کنید'); document.getElementById('loginBtn').disabled = false; return; }
  if(name.length < 2){ showError('نام کامل خود را وارد کنید'); document.getElementById('loginBtn').disabled = false; return; }
  if(!pass){ showError('رمز عبور را وارد کنید'); document.getElementById('loginBtn').disabled = false; return; }

  /* Check remembered */
  var re = localStorage.getItem(K_REMEMBERED_EMPLOYEE);
  var skipCloudCheck = false;
  if(re){
    try {
      var data = JSON.parse(re);
      if(data.name === name && data.password === pass) skipCloudCheck = true;
    } catch(e){}
  }

  if(!skipCloudCheck){
    var cloudPasswords = await getPasswordsFromCloud();
    var empPass = (cloudPasswords && cloudPasswords.employee) || GEO_SETTINGS.DEFAULT_PASSWORD;
    if(pass !== empPass){ showError('رمز عبور اشتباه است'); document.getElementById('loginBtn').disabled = false; return; }
  }

  var remember = document.getElementById('rememberMe').checked;
  if(remember) localStorage.setItem(K_REMEMBERED_EMPLOYEE, JSON.stringify({ name: name, password: pass }));
  else localStorage.removeItem(K_REMEMBERED_EMPLOYEE);

  var userId = 'user_' + btoa(unescape(encodeURIComponent(name))).replace(/[^a-zA-Z0-9]/g, '').substring(0, 20);

  if(db){
    try {
      var userRef = db.collection(GEO_SETTINGS.COLLECTION_USERS).doc(userId);
      var userDoc = await userRef.get();
      var now = Date.now();
      if(userDoc.exists){
        await userRef.update({ lastLogin: now, name: name, loginCount: firebase.firestore.FieldValue.increment(1) });
      } else {
        await userRef.set({ name: name, createdAt: now, lastLogin: now, loginCount: 1 });
      }
      await db.collection(GEO_SETTINGS.COLLECTION_LOGS).add({
        userId: userId, userName: name, action: 'login', details: '', timestamp: now, date: new Date().toISOString()
      });
    } catch(e){}
  }

  var session = { role: 'employee', userId: userId, name: name, loggedIn: true, loginAt: Date.now() };
  localStorage.setItem(K_SESSION, JSON.stringify(session));
  document.getElementById('loadingOverlay').classList.add('show');
  setTimeout(function(){ location.href = 'geo.html'; }, 700);
}

/* ===== Customer Login ===== */
async function loginCustomer(){
  var phone = normalizePhone(document.getElementById('phoneInput').value.trim());
  var pass = document.getElementById('passwordInput').value.trim();

  if(!phone || phone.length < 10){ showError('شماره واتساپ معتبر وارد کنید'); document.getElementById('loginBtn').disabled = false; return; }
  if(!pass){ showError('رمز عبور را وارد کنید'); document.getElementById('loginBtn').disabled = false; return; }

  /* Check remembered */
  var rc = localStorage.getItem(K_REMEMBERED_CUSTOMER);
  var skipCloudCheck = false;
  var rememberedName = '';
  if(rc){
    try {
      var data = JSON.parse(rc);
      if(data.phone === phone && data.password === pass){
        skipCloudCheck = true;
        rememberedName = data.name || '';
      }
    } catch(e){}
  }

  var customerId = 'cust_' + btoa(unescape(encodeURIComponent(phone))).replace(/[^a-zA-Z0-9]/g, '').substring(0, 20);
  var customerName = rememberedName;

  if(!skipCloudCheck){
    if(!db){ showError('اتصال Firebase برقرار نیست'); document.getElementById('loginBtn').disabled = false; return; }
    try {
      var snap = await db.collection(GEO_SETTINGS.COLLECTION_CUSTOMERS).where('phone', '==', phone).limit(1).get();
      if(snap.empty){ showError('این شماره ثبت‌نام نکرده. ابتدا ثبت‌نام کنید.'); document.getElementById('loginBtn').disabled = false; return; }
      var doc = snap.docs[0];
      var customerData = doc.data();
      customerId = doc.id;
      customerName = customerData.name || '';
      if(customerData.password !== pass){ showError('رمز عبور اشتباه است'); document.getElementById('loginBtn').disabled = false; return; }

      /* Update lastLogin */
      await db.collection(GEO_SETTINGS.COLLECTION_CUSTOMERS).doc(customerId).update({
        lastLogin: Date.now(),
        loginCount: firebase.firestore.FieldValue.increment(1)
      }).catch(function(){});
    } catch(e){
      console.error(e);
      showError('خطا در اتصال. دوباره تلاش کنید.');
      document.getElementById('loginBtn').disabled = false;
      return;
    }
  }

  var remember = document.getElementById('rememberMe').checked;
  if(remember) localStorage.setItem(K_REMEMBERED_CUSTOMER, JSON.stringify({ phone: phone, password: pass, name: customerName }));
  else localStorage.removeItem(K_REMEMBERED_CUSTOMER);

  var session = { role: 'customer', userId: customerId, name: customerName, phone: phone, loggedIn: true, loginAt: Date.now() };
  localStorage.setItem(K_SESSION, JSON.stringify(session));

  /* Log */
  if(db){
    db.collection(GEO_SETTINGS.COLLECTION_LOGS).add({
      userId: customerId, userName: customerName, action: 'customer_login', details: '', timestamp: Date.now(), date: new Date().toISOString()
    }).catch(function(){});
  }

  document.getElementById('loadingOverlay').classList.add('show');
  setTimeout(function(){ location.href = 'geo-customer.html'; }, 700);
}
